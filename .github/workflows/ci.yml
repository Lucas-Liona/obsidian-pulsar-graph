name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # GitHub occasionally does not create a run for a push or a force-push to a
  # pull request branch. This makes the checks runnable on demand for any ref.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
