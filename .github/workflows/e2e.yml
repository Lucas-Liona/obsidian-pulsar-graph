name: E2E

# Pulsar inside a real Obsidian (test/e2e), on the oldest public release it
# supports and on the latest. The unit and plugin tests run against a fake
# Obsidian; this is what notices when an Obsidian update changes the graph
# internals the plugin depends on.
#
# GitHub-hosted runners only. The repository is public, and a self-hosted
# runner would run whatever a fork's pull request puts in this file.
#
# The weekly run is the one that catches a new Obsidian release with nobody
# pushing anything. GitHub switches off scheduled workflows in a public
# repository after 60 days without activity; see AGENTS.md for turning it
# back on.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: Obsidian ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The first public release at or above minAppVersion, on the oldest
          # installer that runs it. See test/e2e/wdio.conf.mts.
          - name: 1.8.3
            versions: 1.8.3/earliest
          - name: latest
            versions: latest/latest
    env:
      OBSIDIAN_VERSIONS: ${{ matrix.versions }}
      WDIO_MAX_INSTANCES: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # The versions this run resolves to, as the key for the downloaded
      # Obsidian. Loading the config fetches the version list into the cache
      # directory, which is cleared so the restore below starts clean.
      - name: Resolve Obsidian versions
        run: |
          npx tsx test/e2e/wdio.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt
          cat obsidian-versions-lock.txt
          rm -rf .obsidian-cache

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .obsidian-cache
          key: obsidian-cache-${{ hashFiles('obsidian-versions-lock.txt') }}

      # Obsidian needs a display: a virtual one, and a window manager.
      - name: Virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y xvfb herbstluftwm
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1280x1024x24 +extension GLX -noreset &
          sleep 1
          DISPLAY=:99 herbstluftwm &
          sleep 1

      - run: npm run e2e
